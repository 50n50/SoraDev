<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sora Dev - Logs</title>
  <style>
    @import url('https://rsms.me/inter/inter.css');
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      width: 100%;
      height: 100%;
      background-color: #0c0c0c;
      color: #e0e0e0;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }
    
    .window-controls {
      position: fixed;
      top: 0;
      right: 0;
      display: flex;
      z-index: 9999;
      -webkit-app-region: no-drag;
    }

    .titlebar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 32px;
      background: #0c0c0c;
      -webkit-app-region: drag;
      z-index: 9998;
      border-bottom: 1px solid #1a1a1a;
    }

    .window-btn {
      width: 46px;
      height: 32px;
      background: transparent;
      border: none;
      color: #888;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-app-region: no-drag;
    }

    .window-btn:hover {
      background: #1a1a1a;
      color: #fff;
    }

    .window-btn.close:hover {
      background: #c74050;
      color: #fff;
    }
    
    #logs {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding-top: 32px;
    }
    
    .logs-header {
      padding: 12px 16px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      font-weight: 600;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .logs-header button {
      padding: 4px 8px;
      background: #c74050;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      font-weight: 600;
    }
    
    .logs-header button:hover {
      background: #ff4081;
    }
    
    .logs-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 12px;
      line-height: 1.5;
    }
    
    .log-entry {
      margin-bottom: 8px;
      color: #a0a0a0;
    }
    
    .log-entry.info { color: #4a9eff; }
    .log-entry.success { color: #4caf50; }
    .log-entry.error { color: #ff6b6b; }
    .log-entry.warning { color: #ffb74d; }
    .log-entry.module { color: #bb86fc; }
    .log-entry.module-error { color: #ff6b6b; font-weight: 600; }
    .log-entry.module-warn { color: #ffb74d; }
    
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #1a1a1a;
    }
    ::-webkit-scrollbar-thumb {
      background: #c74050;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #ff4081;
    }
  </style>
</head>
<body>
  <div class="titlebar"></div>
  <div class="window-controls">
    <button class="window-btn" id="minimizeBtn" title="Minimize">−</button>
    <button class="window-btn" id="maximizeBtn" title="Maximize">□</button>
    <button class="window-btn close" id="closeBtn" title="Close">×</button>
  </div>
  <div id="logs">
    <div class="logs-header">
      <span>System Logs</span>
      <button onclick="clearLogs()">Clear</button>
    </div>
    <div id="logsContent" class="logs-content"></div>
  </div>

  <script>
    const logsContent = document.getElementById('logsContent');

    const minimizeBtn = document.getElementById('minimizeBtn');
    const maximizeBtn = document.getElementById('maximizeBtn');
    const closeBtn = document.getElementById('closeBtn');

    if (minimizeBtn) {
      minimizeBtn.addEventListener('click', () => window.api.minimizeWindow());
    }

    if (maximizeBtn) {
      maximizeBtn.addEventListener('click', () => window.api.maximizeWindow());
    }

    if (closeBtn) {
      closeBtn.addEventListener('click', () => window.api.closeWindow());
    }

    window.api.onLog((message) => {
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      
      if (message.includes('[SUCCESS]') || message.includes('loaded')) {
        entry.classList.add('success');
      } else if (message.includes('[MODULE ERROR]')) {
        entry.classList.add('module-error');
      } else if (message.includes('[MODULE WARN]')) {
        entry.classList.add('module-warn');
      } else if (message.includes('[MODULE')) {
        entry.classList.add('module');
      } else if (message.includes('[ERROR]') || message.includes('error') || message.includes('Error')) {
        entry.classList.add('error');
      } else if (message.includes('[INFO]')) {
        entry.classList.add('info');
      }
      
      entry.textContent = message;
      logsContent.appendChild(entry);
      logsContent.scrollTop = logsContent.scrollHeight;
    });

    function clearLogs() {
      logsContent.innerHTML = '';
    }
  </script>
</body>
</html>
