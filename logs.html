<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sora Dev - Logs</title>
  <style>
    @import url('https://rsms.me/inter/inter.css');
    
    :root {
      --bg-base: #0c0d12;
      --bg-surface: #151722;
      --bg-active: #222538;
      --border-color: #222538;
      --border-focus: #333954;
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;
      --primary: #f6821f;
      --primary-hover: #e27221;
      --font-sans: 'Inter', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', 'Monaco', monospace;
    }
    
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }
    
    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-sans);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--border-focus);
    }
    
    .titlebar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 32px;
      background: var(--bg-base);
      -webkit-app-region: drag;
      z-index: 9998;
      border-bottom: 1px solid var(--border-color);
    }

    .window-controls {
      position: fixed;
      top: 0;
      right: 0;
      display: flex;
      z-index: 9999;
      -webkit-app-region: no-drag;
      height: 32px;
    }

    .window-btn {
      width: 44px;
      height: 32px;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .window-btn:hover {
      background: var(--bg-active);
      color: var(--text-primary);
    }

    .window-btn.close:hover {
      background: #ef4444;
      color: #fff;
    }
    
    #logs {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding-top: 32px;
    }
    
    .logs-header {
      padding: 10px 16px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-secondary);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .logs-header button {
      padding: 4px 10px;
      background: var(--bg-base);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }
    
    .logs-header button:hover {
      background: var(--bg-active);
      border-color: var(--border-focus);
    }
    
    .logs-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      line-height: 1.6;
      background: var(--bg-base);
    }
    
    .log-entry {
      margin-bottom: 6px;
      color: var(--text-secondary);
      word-break: break-all;
      white-space: pre-wrap;
    }
    
    .log-entry.info { color: #38bdf8; }
    .log-entry.success { color: #34d399; }
    .log-entry.error { color: #f87171; }
    .log-entry.warning { color: #fbbf24; }
    .log-entry.module { color: #c084fc; }
    .log-entry.module-error { color: #ef4444; font-weight: 600; }
    .log-entry.module-warn { color: #fb923c; }
  </style>
</head>
<body>
  <div class="titlebar"></div>
  <div class="window-controls">
    <button class="window-btn" id="minimizeBtn" title="Minimize">−</button>
    <button class="window-btn" id="maximizeBtn" title="Maximize">□</button>
    <button class="window-btn close" id="closeBtn" title="Close">×</button>
  </div>
  <div id="logs">
    <div class="logs-header">
      <span>System Logs Console</span>
      <button onclick="clearLogs()">Clear Console</button>
    </div>
    <div id="logsContent" class="logs-content"></div>
  </div>

  <script>
    const logsContent = document.getElementById('logsContent');

    const minimizeBtn = document.getElementById('minimizeBtn');
    const maximizeBtn = document.getElementById('maximizeBtn');
    const closeBtn = document.getElementById('closeBtn');

    if (minimizeBtn) {
      minimizeBtn.addEventListener('click', () => window.api.minimizeWindow());
    }

    if (maximizeBtn) {
      maximizeBtn.addEventListener('click', () => window.api.maximizeWindow());
    }

    if (closeBtn) {
      closeBtn.addEventListener('click', () => window.api.closeWindow());
    }

    window.api.onLog((message) => {
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      
      if (message.includes('[SUCCESS]') || message.includes('loaded')) {
        entry.classList.add('success');
      } else if (message.includes('[MODULE ERROR]')) {
        entry.classList.add('module-error');
      } else if (message.includes('[MODULE WARN]')) {
        entry.classList.add('module-warn');
      } else if (message.includes('[MODULE')) {
        entry.classList.add('module');
      } else if (message.includes('[WARNING]') || message.includes('[WARN]')) {
        entry.classList.add('warning');
      } else if (message.includes('[ERROR]') || message.includes('error') || message.includes('Error')) {
        entry.classList.add('error');
      } else if (message.includes('[INFO]')) {
        entry.classList.add('info');
      }
      
      entry.textContent = message;
      logsContent.appendChild(entry);
      logsContent.scrollTop = logsContent.scrollHeight;
    });

    function clearLogs() {
      logsContent.innerHTML = '';
    }
  </script>
</body>
</html>
